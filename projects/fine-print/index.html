<title>Fine Print</title>
<style>
/* ds:start: copied from /design-system/ds.css by tools/sync-ds.mjs. Edit that file, not this copy. */
:root{
--paper:#F4F7FA;
--panel:#FFFFFF;
--ink:#14213D;
--ink-2:#44526E;
--ink-3:#5F6B82;
--rule:#D3DCE7;
--rule-strong:#7D8AA0;
--accent:#2D5BD7;
--on-accent:#FFFFFF;
--accent-soft:#E5ECFB;
--hover:#EEF3F9;
--danger:#B42318;
--danger-soft:#FCEBE9;
--good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --none:#8A94A6;
--mark-stroke:#14213D;
--series-1:#2D5BD7; --series-2:#C2417F;
--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
--font-place:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
--font-mono:ui-monospace,Menlo,Consolas,monospace;
--text-xs:.75rem;
--text-sm:.8125rem;
--text-base:.9375rem;
--text-md:1.0625rem;
--text-lg:1.3rem;
--text-xl:2.25rem;
--text-hero:clamp(1.55rem,1.05rem + 2vw,2.5rem);
--r-panel:6px; --r-control:4px;
--tap:42px;
--focus:3px solid var(--accent);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--paper:#0E1626; --panel:#152036;
--ink:#E8EDF6; --ink-2:#B4BFD3; --ink-3:#8C99B2;
--rule:#26344F; --rule-strong:#6B7A96;
--accent:#7FA2FF; --on-accent:#0E1626; --accent-soft:#1F2E52; --hover:#1A2843;
--danger:#FF8A80; --danger-soft:#33191F;
--mark-stroke:#0E1626; --series-1:#5B83F0; --series-2:#D2558F; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--paper:#0E1626; --panel:#152036;
--ink:#E8EDF6; --ink-2:#B4BFD3; --ink-3:#8C99B2;
--rule:#26344F; --rule-strong:#6B7A96;
--accent:#7FA2FF; --on-accent:#0E1626; --accent-soft:#1F2E52; --hover:#1A2843;
--danger:#FF8A80; --danger-soft:#33191F;
--mark-stroke:#0E1626; --series-1:#5B83F0; --series-2:#D2558F; color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
img{max-width:100%;height:auto}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:var(--r-control);z-index:10}
.skip:focus{top:12px}
.place{font-family:var(--font-place);font-style:italic}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:6px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--panel);color:var(--ink);font-size:var(--text-base);font-weight:600;line-height:1.25;text-align:center;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 82%,var(--ink));border-color:color-mix(in srgb,var(--accent) 82%,var(--ink))}
.btn-lg{min-height:48px;padding:10px 20px;font-size:var(--text-md)}
.btn-block{display:flex;width:100%}
.btn svg{flex:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:var(--text-base);min-height:24px}
.linkbtn:hover{background:var(--hover)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:4px 10px 4px 6px;border:1px solid transparent;border-radius:var(--r-control);background:none;color:var(--accent);font-weight:600}
.backbtn:hover{background:var(--hover)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r-control);overflow:hidden;background:var(--panel)}
.seg button{min-height:calc(var(--tap) - 2px);min-width:46px;padding:6px 12px;border:0;background:transparent;font-size:var(--text-base)}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:6px 14px 6px 10px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel);font-size:var(--text-base);font-variant-numeric:tabular-nums}
.chip b{font-weight:650}
.chip[aria-pressed="false"]{background:transparent;color:var(--ink-3);border-style:dashed}
.chip[aria-pressed="false"] svg{opacity:.3}
.chip svg{flex:none}
.field{display:grid;gap:4px;font-size:var(--text-sm);color:var(--ink-2)}
select,input:is([type="search"],[type="text"],[type="tel"],[type="email"],[type="number"]){min-height:var(--tap);padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--panel);color:var(--ink);font-size:var(--text-base)}
input[type="search"]{width:100%}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger)}
.help{color:var(--ink-3);font-size:var(--text-sm)}
.error{display:flex;gap:6px;align-items:flex-start;color:var(--danger);font-size:var(--text-sm);font-weight:600}
.error svg{flex:none;margin-top:2px}
.choice{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-panel);background:var(--panel);color:var(--ink);cursor:pointer}
.choice input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.choice:hover{background:var(--hover)}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:var(--focus);outline-offset:2px}
.choice input:focus-visible{outline:none}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel)}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:12px 14px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-panel);background:var(--panel)}
.notice>svg{grid-row:1 / span 2;margin-top:3px}
.notice-good{border-left-color:var(--good)}
.notice-warn{border-left-color:var(--warn)}
.notice-crit{border-left-color:var(--crit)}
.notice-error{border-left-color:var(--danger);background:var(--danger-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ds:end */
/* hide what the script fills in until it has run, so nothing jumps on load */
.boot main,.boot .prefs{visibility:hidden}
.noscript{max-width:60ch;margin:24px 0;color:var(--ink-2)}
</style>
<style>
/* Fine Print uses the shared components with its own palette: warm paper, ink, and a seal red for the cost.
   Layout: one offer per card, the inputs beside a receipt of the result; one column on phones. */
:root{
  --paper:#F8F5EF; --panel:#FFFDF9; --ink:#23201B; --ink-2:#4E4840; --ink-3:#6A6257;
  --rule:#E2DACD; --rule-strong:#8A8073; --accent:#1D5C8C; --on-accent:#FFFFFF; --accent-soft:#E6EDF3; --hover:#F1ECE3;
  --danger:#9E2A20; --danger-soft:#F7E6E2; --seal:#9E2A20; --loan:#B9AE9E;
  --font-serif:Georgia,"Iowan Old Style","Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191714; --panel:#211E1A; --ink:#EFE9DF; --ink-2:#CFC6B8; --ink-3:#A69C8E;
    --rule:#37322B; --rule-strong:#7A7166; --accent:#8DB8E0; --on-accent:#191714; --accent-soft:#24323F; --hover:#2A2620;
    --danger:#F0907F; --danger-soft:#3A221E; --seal:#F0907F; --loan:#6F665A;
  }
}
:root[data-theme="dark"]{
  --paper:#191714; --panel:#211E1A; --ink:#EFE9DF; --ink-2:#CFC6B8; --ink-3:#A69C8E;
  --rule:#37322B; --rule-strong:#7A7166; --accent:#8DB8E0; --on-accent:#191714; --accent-soft:#24323F; --hover:#2A2620;
  --danger:#F0907F; --danger-soft:#3A221E; --seal:#F0907F; --loan:#6F665A;
}
body{font-size:var(--text-md);line-height:1.55}
.page{max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 64px}
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px;border-bottom:1px solid var(--rule)}
.mark{display:inline-flex;align-items:center;gap:10px;min-height:var(--tap);color:var(--ink);text-decoration:none;font-family:var(--font-serif);font-size:1.35rem;font-style:italic;letter-spacing:-.01em}
.mark svg{flex:none}
.prefs{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prefs select{min-height:40px;font-size:var(--text-base)}
.prefs .seg button{min-height:38px}
h1{font-family:var(--font-serif);font-weight:400;font-size:clamp(1.9rem,1.3rem + 2.4vw,2.9rem);line-height:1.12;letter-spacing:-.015em;margin:40px 0 10px;max-width:20ch}
.lede{color:var(--ink-2);max-width:52ch}

/* an offer: the inputs and the receipt */
.offer{margin-top:28px;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--panel)}
.offer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px;border-bottom:1px solid var(--rule)}
.offer-head h2{font-family:var(--font-serif);font-weight:400;font-size:1.25rem}
.offer-head .acts{display:flex;gap:4px}
.offer-head .linkbtn{padding:6px 10px;min-height:36px;font-size:var(--text-sm);border-radius:var(--r-control)}
.offer-body{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.inputs{display:grid;gap:18px;align-content:start;padding:18px}
.types{border:0;margin:0;padding:0;display:grid;gap:8px}
.types legend{padding:0;margin-bottom:8px;font-weight:650;font-size:var(--text-base)}
.types .choice{min-height:0;padding:9px 12px;align-items:flex-start;font-size:var(--text-base)}
.types .choice input{margin-top:2px;width:20px;height:20px}
.types .choice span{display:grid;gap:1px}
.types .choice small{color:var(--ink-3);font-size:var(--text-sm)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px}
.fields .wide{grid-column:1 / -1}
.inputs .field{font-size:var(--text-sm);color:var(--ink-2)}
.inputs .field>span:first-child,.inputs .field>label{font-weight:600;color:var(--ink)}
.inputs input,.inputs select{width:100%;font-size:var(--text-md);font-variant-numeric:tabular-nums}
.inputs .help{font-size:var(--text-xs)}

/* the receipt */
.receipt{display:grid;gap:12px;align-content:start;padding:20px 22px;border-left:1px dashed var(--rule-strong);background:var(--paper);border-radius:0 var(--r-panel) var(--r-panel) 0}
.r-label{font-size:var(--text-sm);color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.r-big{font-family:var(--font-serif);font-size:clamp(3rem,2.2rem + 3vw,4.2rem);line-height:1;letter-spacing:-.02em}
.r-big small{font-size:.5em;margin-left:2px}
.r-sub{color:var(--ink-3);font-size:var(--text-sm);margin-top:-6px}
.r-lines{display:grid;gap:4px;margin:4px 0 0;font-variant-numeric:tabular-nums}
.r-lines div{display:flex;align-items:baseline;gap:8px}
.r-lines dt{flex:1;display:flex;align-items:baseline;gap:8px;color:var(--ink-2)}
.r-lines dt::after{content:"";flex:1;border-bottom:1px dotted var(--rule-strong);transform:translateY(-4px)}
.r-lines dd{margin:0;font-family:var(--font-mono);font-size:var(--text-base)}
.r-lines .cost dt,.r-lines .cost dd{color:var(--seal);font-weight:700}
.r-bar{display:flex;gap:2px;height:14px}
.r-bar span{border-radius:4px}
.r-bar .loan{background:var(--loan)}
.r-bar .cost{background:var(--seal)}
.r-key{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:var(--text-sm);color:var(--ink-2)}
.r-key span{display:inline-flex;align-items:center;gap:6px}
.r-key i{display:inline-block;width:12px;height:12px;border-radius:3px}
.r-plan{font-size:var(--text-base)}
.r-why{font-size:var(--text-base);color:var(--ink-2);border-top:1px dashed var(--rule-strong);padding-top:12px}
.r-empty{color:var(--ink-3);font-size:var(--text-base);align-self:center}
.sched summary,.how summary{cursor:pointer;color:var(--accent);font-size:var(--text-sm);font-weight:600;min-height:32px;display:inline-flex;align-items:center}
.sched{font-size:var(--text-sm)}
.sched .wrapt{max-height:280px;overflow:auto;margin-top:6px;border:1px solid var(--rule);border-radius:var(--r-control)}
.sched table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.sched th,.sched td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
.sched th:first-child,.sched td:first-child{text-align:left}
.sched thead th{position:sticky;top:0;background:var(--panel);color:var(--ink-2);font-weight:600}

.minibar{display:none}
.addrow{margin-top:16px}
.addrow .btn{border-style:dashed}

/* side by side */
.compare{margin-top:36px}
.compare h2{font-family:var(--font-serif);font-weight:400;font-size:1.5rem;margin-bottom:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--panel)}
.ctable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:var(--text-base)}
.ctable th,.ctable td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--rule);vertical-align:middle}
.ctable th:first-child{text-align:left}
.ctable thead th{font-size:var(--text-sm);color:var(--ink-2);font-weight:600}
.ctable tbody tr:last-child>*{border-bottom:0}
.seal{display:inline-block;margin-left:10px;padding:1px 8px;border:2px solid var(--seal);border-radius:4px;color:var(--seal);font-size:var(--text-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;transform:rotate(-4deg);vertical-align:2px}
.cnote{margin-top:10px;color:var(--ink-2);font-size:var(--text-base);max-width:64ch}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.msg{color:var(--ink-2);font-size:var(--text-sm)}
.fallback{width:100%;min-height:120px;padding:8px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--panel);font-family:var(--font-mono);font-size:var(--text-sm)}
.how{margin-top:28px;font-size:var(--text-base);color:var(--ink-2);max-width:64ch}
.how p{margin-top:6px}
.fine{margin-top:18px;color:var(--ink-3);font-size:var(--text-sm)}

@media (max-width:759px){
  .offer-body{grid-template-columns:minmax(0,1fr)}
  /* on a phone the receipt is below the form, so the rate rides along at the bottom while you type */
  .minibar{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;margin:0 -18px -18px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);font-size:var(--text-base);font-variant-numeric:tabular-nums}
  .minibar b{font-family:var(--font-serif);font-size:1.25rem;font-weight:400}
  .receipt{border-left:0;border-top:1px dashed var(--rule-strong);border-radius:0 0 var(--r-panel) var(--r-panel)}
}
@media (max-width:560px){
  .ctable{font-size:var(--text-sm)}
  .ctable th,.ctable td{padding:10px 6px}
  .seal{display:inline-block;margin:6px 0 2px 4px;padding:1px 5px;font-size:10px;letter-spacing:.03em;line-height:1.3;text-align:center;transform:rotate(-3deg)} /* wraps into a square seal */
}
@media (max-width:420px){.fields{grid-template-columns:minmax(0,1fr)}}
@media print{
  .top .prefs,.types,.offer-head .acts,.addrow,.actions,.how,.sched summary,.skip{display:none!important}
  .sched[open] .wrapt,.sched .wrapt{max-height:none;overflow:visible}
  body,.page,.offer,.receipt{background:#fff;color:#000}
  .offer{break-inside:avoid}
}
</style>

const loc=()=>S.lang==='zh'?'zh-CN':'en-GB';
const NF={},fmt=(min,max)=>{const k=loc()+min+max;return NF[k]||(NF[k]=new Intl.NumberFormat(loc(),{minimumFractionDigits:min,maximumFractionDigits:max}));};
const num=(v,d)=>fmt(d||0,d||0).format(v);
function money(v){const whole=Math.abs(v-Math.round(v))<0.005;return S.cur+num(v,whole?0:2);}
const moneyRound=v=>S.cur+num(Math.round(v),0); /* whole units are enough when comparing */
function pct(v){if(!isFinite(v))return '–';const d=Math.abs(v)>=100?0:1;return num(v,d)+'%';}
const pctIn=v=>fmt(0,2).format(v)+'%';
function parse(str){
  if(str===undefined||str===null)return NaN;
  let s=String(str).trim().replace(/[%％¥$€£₹₦]/g,'').replace(/^KSh/i,'').replace(/\s/g,'').replace(/，/g,',');
  if(/^\d+,\d{1,2}$/.test(s))s=s.replace(',','.'); /* "0,6" is a decimal comma, "10,000" is thousands */
  s=s.replace(/[,_]/g,'');
  return s===''?NaN:Number(s);
}

/* ---------- the maths: the rate per period at which the payments are worth exactly what you get ---------- */
function solve(received,pays){
  const total=pays.reduce((a,b)=>a+b,0);
  if(total<=received)return 0;
  const pv=r=>{let s=0,f=1;for(const p of pays){f/=(1+r);s+=p*f;}return s;};
  let lo=0,hi=1;while(pv(hi)>received&&hi<1e7)hi*=2;
  for(let i=0;i<200;i++){const m=(lo+hi)/2;if(pv(m)>received)lo=m;else hi=m;}
  return (lo+hi)/2;
}
/* read and check one offer; returns errors per field, or the result */
function evaluate(o){
  const v=o.v,err={},n=k=>parse(v[k]);
  const need=(k,ok,msg)=>{const x=n(k);if(!isFinite(x)||!ok(x))err[k]=msg;return x;};
  const E=L().err;
  const upfront=v.upfront===''||v.upfront===undefined?0:n('upfront');
  if(!isFinite(upfront)||upfront<0)err.upfront=E.pos;
  let received,pays,per,ppy,count;
  if(o.type==='fixed'){
    const get=need('get',x=>x>0,E.pos),p=need('payment',x=>x>0,E.pos);count=need('count',x=>Number.isInteger(x)&&x>=1&&x<=600,E.count);
    per=v.every in PPY?v.every:'month';ppy=PPY[per];received=get-upfront;pays=Array(count>0&&count<=600?count:0).fill(p);
    if(!err.get&&!err.upfront&&upfront>=get)err.upfront=E.upfront;
  }else if(o.type==='fee'||o.type==='rate'){
    const P=need('amount',x=>x>0,E.pos);count=need('months',x=>Number.isInteger(x)&&x>=1&&x<=600,E.count);per='month';ppy=12;
    let pay;
    if(o.type==='fee'){const f=need('fee',x=>x>=0&&x<=100,E.pct);pay=P/count+P*f/100;}
    else{const y=need('rate',x=>x>=0&&x<=100,E.pct),i=y/100/12;pay=i?P*i/(1-Math.pow(1+i,-count)):P/count;}
    received=P-upfront;pays=Array(count>0&&count<=600?count:0).fill(pay);
    if(!err.amount&&!err.upfront&&upfront>=P)err.upfront=E.upfront;
  }else{
    const get=need('get',x=>x>0,E.pos),back=need('back',x=>x>0,E.pos),days=need('days',x=>Number.isInteger(x)&&x>=1&&x<=3650,E.days);
    per='once';count=1;received=get-upfront;pays=[back];ppy=365/days;
    if(!err.get&&!err.upfront&&upfront>=get)err.upfront=E.upfront;
  }
  if(Object.keys(err).length)return {err};
  const r=solve(received,pays),total=pays.reduce((a,b)=>a+b,0);
  return {err:null,received,pays,total,cost:total+upfront-(received+upfront),per,ppy,count,r,apr:r*ppy*100,ear:(Math.pow(1+r,ppy)-1)*100,upfront,none:total<=received};
}

const results={};
function update(o,opt){
  const res=evaluate(o);results[o.id]=res;
  const box=$('offer-'+o.id);if(!box)return;
  FIELDS[o.type].forEach(k=>{const inp=box.querySelector('[data-k="'+k+'"]'),e=$('o'+o.id+'-'+k+'-err');if(!e)return;
    const m=res.err&&res.err[k];const touched=inp&&inp.dataset.touched==='1';
    if(m&&touched){e.textContent=m;e.hidden=false;inp.setAttribute('aria-invalid','true');}else{e.textContent='';e.hidden=true;inp&&inp.removeAttribute('aria-invalid');}});
  renderReceipt(o,res);
  renderCompare();save();

function renderReceipt(o,res){
  const L_=L(),R=L_.r,box=$('rc-'+o.id);

  if(res.err){box.innerHTML='<p class="r-empty">'+R.empty+'</p>';if(mb)mb.textContent='';if(mb)mb.hidden=true;return;}

  const pay=res.pays[0],plan=res.per==='once'?L_.plan.once(money(pay),Math.round(365/res.ppy)):L_.plan[res.per](res.count,money(pay));
  const cost=Math.max(0,res.total+res.upfront-(res.received+res.upfront));
  const v=o.v;let why;

  else if(o.type==='fee')why=L_.why.fee(pctIn(parse(v.fee)),pctIn(parse(v.fee)*12),pct(res.apr));
  else if(o.type==='rate')why=res.upfront>0?L_.why.rateFee(pctIn(parse(v.rate)),money(res.upfront),pct(res.apr)):L_.why.rate();
  else if(o.type==='once')why=L_.why.once(money(cost),Math.round(365/res.ppy),pct(res.apr));
  else why=L_.why.fixed(money(cost),res.count,pct(res.apr));
  let h='<p class="r-label">'+R.label+'</p><p class="r-big">'+(res.none?'0':pct(res.apr).replace('%',''))+'<small>%</small></p><p class="r-sub">'+R.sub+'</p>'+
    '<dl class="r-lines"><div><dt>'+R.get+'</dt><dd>'+money(res.received)+'</dd></div><div><dt>'+R.back+'</dt><dd>'+money(res.total)+'</dd></div><div class="cost"><dt>'+R.cost+'</dt><dd>'+money(cost)+'</dd></div></dl>';
  if(cost>0)h+='<div class="r-bar" aria-hidden="true"><span class="loan" style="flex:'+res.received+'"></span><span class="cost" style="flex:'+cost+'"></span></div><p class="r-key"><span><i style="background:var(--loan)"></i>'+R.loan+'</span><span><i style="background:var(--seal)"></i>'+R.costKey+'</span></p>';
  h+='<p class="r-plan">'+plan+'</p><p class="r-why">'+why+'</p>';
  if(res.per!=='once'&&!res.none){

    h+='<details class="sched"'+(open?' open':'')+'><summary>'+R.sched+'</summary><div class="wrapt" tabindex="0" role="region" aria-label="'+R.sched+'"><table><thead><tr>'+R.cols.map(c=>'<th scope="col">'+c+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div></details>';
  }

function lengthOf(res){const L_=L();return res.per==='once'?L_.len.once(Math.round(365/res.ppy)):L_.len[res.per](res.count);}
function renderCompare(){
  const L_=L(),C=L_.cmp,ok=S.offers.filter(o=>results[o.id]&&!results[o.id].err);

  const cheapest=ok.slice().sort((a,b)=>costOf(a)-costOf(b))[0].id;

  sorted.forEach(o=>{const r=results[o.id];h+='<tr><th scope="row">'+L_.offer(o.id)+(o.id===best?'<span class="seal">'+C.seal+'</span>':'')+'</th><td>'+pct(r.apr)+'</td><td>'+moneyRound(costOf(o))+'</td><td>'+moneyRound(r.pays[0])+'</td><td>'+lengthOf(r)+'</td></tr>';});

  const b=e.target.closest('[data-act]');if(!b)return;const o=offerOf(b);if(!o)return;
  if(b.dataset.act==='clear'){Object.keys(o.v).forEach(k=>{o.v[k]=k==='every'?'month':'';});renderOffers();const f=$('offer-'+o.id).querySelector('.fields input');if(f)f.focus();}
  if(b.dataset.act==='remove'){S.offers=S.offers.filter(x=>x!==o);S.offers.forEach((x,i)=>{x.id='ABC'[i];});applyStatic();renderOffers();$('add').focus();}
  save();
});
$('add').addEventListener('click',()=>{
  if(S.offers.length>=3)return;
  const id='ABC'[S.offers.length];const last=S.offers[S.offers.length-1];
  S.offers.push({id,type:last.type,v:Object.assign({},last.v)});
  applyStatic();renderOffers();const sec=$('offer-'+id);sec.scrollIntoView({block:'start'});const f=sec.querySelector('.fields input');if(f)f.focus();
});
$('lang-en').addEventListener('click',()=>{S.lang='en';applyStatic();renderOffers();save();});
$('lang-zh').addEventListener('click',()=>{S.lang='zh';applyStatic();renderOffers();save();});
$('cur').addEventListener('change',e=>{S.cur=e.target.value;renderOffers();save();});
$('print').addEventListener('click',()=>{document.querySelectorAll('.sched').forEach(d=>d.open=true);window.print();});
$('copy').addEventListener('click',()=>{
  const L_=L(),lines=S.offers.map(o=>{const r=results[o.id];if(!r||r.err)return null;const plan=r.per==='once'?L_.plan.once(money(r.pays[0]),Math.round(365/r.ppy)):L_.plan[r.per](r.count,money(r.pays[0]));
    return L_.sum(o.id,money(r.received),money(r.total),money(Math.max(0,r.total-r.received)),pct(r.apr),plan);}).filter(Boolean);
  const text=lines.join('\n'),msg=$('copy-msg');
  const fallback=()=>{msg.textContent=L_.blocked;let ta=document.querySelector('.fallback');if(!ta){ta=document.createElement('textarea');ta.className='fallback';ta.readOnly=true;ta.setAttribute('aria-label',L_.copy);msg.after(ta);}ta.value=text;ta.focus();ta.select();};
  try{navigator.clipboard.writeText(text).then(()=>{msg.textContent=L_.copied;},fallback);}catch(e){fallback();}
});

applyStatic();renderOffers();
document.body.classList.remove('boot');
})();
</script>
</body>
