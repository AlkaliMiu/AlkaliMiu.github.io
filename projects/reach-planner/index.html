<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Reach Planner: a low-bandwidth planning tool that shows which schools a budget can connect next, by fibre, mobile or satellite, and what each priority rule trades off. Sample data and illustrative costs.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 34 34%27%3E%3Cg fill=%27%2314213D%27%3E%3Crect x=%273%27 y=%2721%27 width=%276%27 height=%2710%27 rx=%271.5%27/%3E%3Crect x=%2711%27 y=%2715%27 width=%276%27 height=%2716%27 rx=%271.5%27/%3E%3Crect x=%2719%27 y=%279%27 width=%276%27 height=%2722%27 rx=%271.5%27/%3E%3C/g%3E%3Crect x=%2727%27 y=%273%27 width=%275%27 height=%2728%27 rx=%271.5%27 fill=%27%237D8AA0%27/%3E%3C/svg%3E">
<title>Reach Planner</title>
<style>
/* ds:start: copied from /design-system/ds.css by tools/sync-ds.mjs. Edit that file, not this copy. */
:root{
--paper:#F4F7FA;
--panel:#FFFFFF;
--ink:#14213D;
--ink-2:#44526E;
--ink-3:#5F6B82;
--rule:#D3DCE7;
--rule-strong:#7D8AA0;
--accent:#2D5BD7;
--on-accent:#FFFFFF;
--accent-soft:#E5ECFB;
--hover:#EEF3F9;
--danger:#B42318;
--danger-soft:#FCEBE9;
--good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --none:#8A94A6;
--mark-stroke:#14213D;
--series-1:#2D5BD7; --series-2:#C2417F;
--font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
--font-place:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
--font-mono:ui-monospace,Menlo,Consolas,monospace;
--text-xs:.75rem;
--text-sm:.8125rem;
--text-base:.9375rem;
--text-md:1.0625rem;
--text-lg:1.3rem;
--text-xl:2.25rem;
--text-hero:clamp(1.55rem,1.05rem + 2vw,2.5rem);
--r-panel:6px; --r-control:4px;
--tap:42px;
--focus:3px solid var(--accent);
}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]){
--paper:#0E1626; --panel:#152036;
--ink:#E8EDF6; --ink-2:#B4BFD3; --ink-3:#8C99B2;
--rule:#26344F; --rule-strong:#6B7A96;
--accent:#7FA2FF; --on-accent:#0E1626; --accent-soft:#1F2E52; --hover:#1A2843;
--danger:#FF8A80; --danger-soft:#33191F;
--mark-stroke:#0E1626; --series-1:#5B83F0; --series-2:#D2558F; color-scheme:dark;
}
}
:root[data-theme="dark"]{
--paper:#0E1626; --panel:#152036;
--ink:#E8EDF6; --ink-2:#B4BFD3; --ink-3:#8C99B2;
--rule:#26344F; --rule-strong:#6B7A96;
--accent:#7FA2FF; --on-accent:#0E1626; --accent-soft:#1F2E52; --hover:#1A2843;
--danger:#FF8A80; --danger-soft:#33191F;
--mark-stroke:#0E1626; --series-1:#5B83F0; --series-2:#D2558F; color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:var(--text-base);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
img{max-width:100%;height:auto}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-underline-offset:3px}
:focus-visible{outline:var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:16px;top:-60px;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:var(--r-control);z-index:10}
.skip:focus{top:12px}
.place{font-family:var(--font-place);font-style:italic}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:6px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--panel);color:var(--ink);font-size:var(--text-base);font-weight:600;line-height:1.25;text-align:center;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent) 82%,var(--ink));border-color:color-mix(in srgb,var(--accent) 82%,var(--ink))}
.btn-lg{min-height:48px;padding:10px 20px;font-size:var(--text-md)}
.btn-block{display:flex;width:100%}
.btn svg{flex:none}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:var(--text-base);min-height:24px}
.linkbtn:hover{background:var(--hover)}
.backbtn{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:4px 10px 4px 6px;border:1px solid transparent;border-radius:var(--r-control);background:none;color:var(--accent);font-weight:600}
.backbtn:hover{background:var(--hover)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r-control);overflow:hidden;background:var(--panel)}
.seg button{min-height:calc(var(--tap) - 2px);min-width:46px;padding:6px 12px;border:0;background:transparent;font-size:var(--text-base)}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);padding:6px 14px 6px 10px;border:1px solid var(--rule-strong);border-radius:999px;background:var(--panel);font-size:var(--text-base);font-variant-numeric:tabular-nums}
.chip b{font-weight:650}
.chip[aria-pressed="false"]{background:transparent;color:var(--ink-3);border-style:dashed}
.chip[aria-pressed="false"] svg{opacity:.3}
.chip svg{flex:none}
.field{display:grid;gap:4px;font-size:var(--text-sm);color:var(--ink-2)}
select,input:is([type="search"],[type="text"],[type="tel"],[type="email"],[type="number"]){min-height:var(--tap);padding:6px 10px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--panel);color:var(--ink);font-size:var(--text-base)}
input[type="search"]{width:100%}
[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:inset 0 0 0 1px var(--danger)}
.help{color:var(--ink-3);font-size:var(--text-sm)}
.error{display:flex;gap:6px;align-items:flex-start;color:var(--danger);font-size:var(--text-sm);font-weight:600}
.error svg{flex:none;margin-top:2px}
.choice{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border:1px solid var(--rule-strong);border-radius:var(--r-panel);background:var(--panel);color:var(--ink);cursor:pointer}
.choice input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--accent)}
.choice:hover{background:var(--hover)}
.choice:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.choice:has(input:focus-visible){outline:var(--focus);outline-offset:2px}
.choice input:focus-visible{outline:none}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel)}
.notice{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start;padding:12px 14px;border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:var(--r-panel);background:var(--panel)}
.notice>svg{grid-row:1 / span 2;margin-top:3px}
.notice-good{border-left-color:var(--good)}
.notice-warn{border-left-color:var(--warn)}
.notice-crit{border-left-color:var(--crit)}
.notice-error{border-left-color:var(--danger);background:var(--danger-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* ds:end */
</style>
<style>
/* Layout: plan settings in one row; the answer sentence; a budget curve; a map beside the school list;
   work packages for providers; editable cost assumptions. One column on phones, with a List / Map switch.
   Colours, type and controls come from the shared design system above; only map colours are defined here. */
:root{--map-paper:#F7FAFD; --land:#FFFFFF; --grid:#E1E9F2; --grid-major:#C3D1E1; --water:#5E93D6}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--map-paper:#101B2E; --land:#18263F; --grid:#17243A; --grid-major:#22334F; --water:#4F7FC0}
}
:root[data-theme="dark"]{--map-paper:#101B2E; --land:#18263F; --grid:#17243A; --grid-major:#22334F; --water:#4F7FC0}

.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px;display:grid;gap:22px}
.wrap>main{display:grid;gap:26px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{width:34px;height:34px;flex:none;color:var(--ink)}
h1{font-size:var(--text-lg);font-weight:700;letter-spacing:-0.01em;line-height:1.2}
.region{color:var(--ink-2);font-size:var(--text-sm)}
.field.lang{flex:0 0 auto}

/* plan settings: one row above everything they change */
.settings{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;padding:14px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel)}
.budget{display:grid;gap:4px;font-size:var(--text-sm);color:var(--ink-2);flex:1 1 280px;min-width:0}
.budget .val{font-size:var(--text-md);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.budget input{width:100%;height:var(--tap);margin:0;accent-color:var(--accent)}
.rule .seg button{white-space:nowrap}

/* answer */
.summary{display:grid;gap:10px}
.scope{color:var(--ink-2);font-size:var(--text-base)}
.hero{font-size:var(--text-hero);line-height:1.12;font-weight:700;letter-spacing:-0.022em;max-width:26ch}
.hero-sub{max-width:68ch;color:var(--ink-2);font-size:var(--text-md);line-height:1.45}
.asides{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--ink-2);font-size:var(--text-base)}
.asides p{display:flex;gap:8px;align-items:baseline;max-width:62ch}
.asides svg{flex:none;align-self:center}

/* budget curve */
.curve{display:grid;gap:8px;max-width:820px}
.curvehead{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:baseline;justify-content:space-between}
h2.ph{font-size:var(--text-md);font-weight:650}
.key{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0;padding:0;list-style:none;font-size:var(--text-sm);color:var(--ink-2)}
.key li{display:flex;gap:8px;align-items:center}
.chartbox{position:relative}
#curve{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.readout{font-size:var(--text-sm);color:var(--ink-2);font-variant-numeric:tabular-nums}
details{font-size:var(--text-sm);color:var(--ink-2)}
summary{cursor:pointer;color:var(--accent);min-height:28px;display:inline-flex;align-items:center}
.smalltable{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.smalltable th,.smalltable td{padding:3px 16px 3px 0;text-align:right;border-bottom:1px solid var(--rule)}
.smalltable th:first-child,.smalltable td:first-child{text-align:left}

/* map and list */
.viewtoggle{display:none}
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:stretch}
.panelhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.hint{color:var(--ink-3);font-size:var(--text-sm)}
.mappanel{display:grid;gap:8px;align-content:start;min-width:0}
.layers{display:flex;flex-wrap:wrap;gap:8px}
.mapbox{position:relative;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--map-paper);overflow:hidden;aspect-ratio:10/7}
#map{display:block;width:100%;height:100%;touch-action:manipulation}
.north{position:absolute;top:10px;right:12px;display:grid;justify-items:center;color:var(--ink-2);font-family:var(--font-place);font-size:var(--text-sm);pointer-events:none}
.north svg{width:14px;height:20px}
.north path{fill:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;padding:0;list-style:none;font-size:var(--text-sm);color:var(--ink-2)}
.legend li{display:flex;gap:6px;align-items:center}
.legend svg{flex:none}
.mapnote{color:var(--ink-3);font-size:var(--text-sm);max-width:70ch}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:var(--r-control);font-size:var(--text-sm);line-height:1.35;max-width:250px;box-shadow:0 2px 8px rgba(10,20,40,.25)}
.tip b{display:block;font-weight:650}
.listpanel{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel);min-width:0;min-height:480px}
.listinner{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.listhead{display:grid;gap:10px;padding:14px 16px 12px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters .chip{min-height:38px;padding:4px 12px 4px 8px;font-size:var(--text-sm)}
.count{color:var(--ink-3);font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.msg{color:var(--ink-2);font-size:var(--text-sm)}
.schools{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1;min-height:0;border-top:1px solid var(--rule)}
.schools li+li{border-top:1px solid var(--rule)}
.row{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;min-height:58px;padding:9px 16px;border:0;background:transparent;text-align:left}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--accent-soft)}
.rk{grid-row:1 / span 2;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:var(--text-xs);font-weight:700;font-variant-numeric:tabular-nums}
.rk.in{background:var(--accent);color:var(--on-accent)}
.rk.out{border:1px solid var(--rule-strong);color:var(--ink-2)}
.nm{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meta{grid-column:2;color:var(--ink-3);font-size:var(--text-sm);line-height:1.3}
.sp{grid-row:1 / span 2;grid-column:3;text-align:right;font-variant-numeric:tabular-nums;font-weight:650;line-height:1.25}
.sp small{display:block;font-weight:400;color:var(--ink-3);font-size:var(--text-xs)}
.empty{padding:22px 16px;color:var(--ink-2)}
.fallback{padding:0 16px 14px;display:grid;gap:6px;font-size:var(--text-sm);color:var(--ink-2)}
.fallback textarea{width:100%;min-height:120px;padding:8px;border:1px solid var(--rule-strong);border-radius:var(--r-control);background:var(--paper);font-family:var(--font-mono);font-size:var(--text-xs)}

/* school detail */
.detail{padding:12px 16px 18px;display:grid;gap:14px;overflow-y:auto;align-content:start;flex:1;min-height:0}
.detail .backbtn{justify-self:start}
.dname{font-size:var(--text-lg);font-weight:700;line-height:1.2;letter-spacing:-0.01em}
.dsub{color:var(--ink-2);font-size:var(--text-base)}
.statusline{display:flex;align-items:center;gap:8px;font-weight:600}
.verdict{font-size:var(--text-md);line-height:1.4}
.opts{width:100%;border-collapse:collapse;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.opts th,.opts td{padding:7px 8px 7px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
.opts thead th{color:var(--ink-3);font-weight:600}
.opts .num{text-align:right}
.opts tr.chosen>*{background:var(--accent-soft)}
.opts tr.chosen th{box-shadow:inset 3px 0 0 var(--accent);padding-left:8px}
.opts .na{color:var(--ink-3)}
.opts .tag{display:inline-block;padding:0 8px;border:1px solid var(--accent);border-radius:999px;font-size:var(--text-xs);font-weight:600;line-height:1.6;vertical-align:1px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin:0;font-size:var(--text-base)}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

/* work packages and assumptions */
.block{display:grid;gap:10px}
.cap{color:var(--ink-3);font-size:var(--text-sm);max-width:76ch}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--panel)}
table.dt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:600px}
.dt th,.dt td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:middle}
.dt thead th{font-weight:600;color:var(--ink-2);font-size:var(--text-sm)}
.dt .num{text-align:right}
.dt tfoot td,.dt tfoot th{font-weight:700;border-bottom:0}
.place{font-family:var(--font-place);font-style:italic}
.assume{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px 18px;padding:16px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel)}
.assume input{width:100%;font-variant-numeric:tabular-nums}
.assume .help{font-size:var(--text-xs)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

footer{display:grid;gap:6px;padding-top:18px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:var(--text-sm);max-width:78ch}

@media (max-width:760px){
  .main{grid-template-columns:minmax(0,1fr)}
  .viewtoggle{display:inline-flex;justify-self:start}
  .main[data-view="list"] .mappanel{display:none}
  .main[data-view="map"] .listpanel{display:none}
  .listpanel{min-height:0}
  .listinner{position:static}
  .schools{max-height:68vh}
  .rule .seg{display:flex;width:100%}
  .rule .seg button{flex:1;white-space:normal}
  .rule{flex:1 1 100%}
}
@media (max-width:560px){
  table.dt{min-width:0}
  .dt th,.dt td{padding:10px 8px}
  .dt .opt{display:none}
}
</style>
</head>
<body>
<a class="skip" href="#schools" data-i18n="skip">Skip to the school list</a>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><circle cx="9" cy="25" r="4" fill="currentColor"/><path d="M9 25 C 14 12, 22 22, 27 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4.5"/><path d="M27 3 l4 6.5 h-8 z" fill="currentColor"/></svg>
      <div>
        <h1>Reach Planner</h1>
        <p class="region"><span class="place" data-i18n="region">Central Lowlands Region</span>. <span data-i18n="sample">Sample data and illustrative costs.</span></p>
      </div>
    </div>
    <div class="field lang"><span id="lang-label" data-i18n="language">Language</span>
      <div class="seg" role="group" aria-labelledby="lang-label">
        <button type="button" id="lang-en" lang="en" aria-label="EN, English">EN</button>
        <button type="button" id="lang-fr" lang="fr" aria-label="FR, Français">FR</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="settings" aria-labelledby="settings-title">
      <h2 class="sr-only" id="settings-title" data-i18n="settings">Plan settings</h2>
      <label class="budget" for="budget"><span><span data-i18n="budget">Budget for 5 years</span>: <output class="val" id="budget-out" for="budget"></output></span>
        <input type="range" id="budget" min="50000" max="1500000" step="50000"></label>
      <div class="field rule"><span id="rule-label" data-i18n="rule">Who goes first</span>
        <div class="seg" role="group" aria-labelledby="rule-label">
          <button type="button" id="rule-value"></button>
          <button type="button" id="rule-equity"></button>
        </div>
      </div>
      <label class="field" for="target"><span data-i18n="target">Target speed</span><select id="target"></select></label>
    </section>

    <section class="summary" aria-labelledby="hero">
      <p class="scope" id="scope"></p>
      <h2 class="hero" id="hero"></h2>
      <p class="hero-sub" id="hero-sub"></p>
      <div class="asides" id="asides"></div>
    </section>

    <section class="curve" aria-labelledby="curve-title">
      <div class="curvehead"><h2 class="ph" id="curve-title"></h2>
        <ul class="key" id="curve-key"></ul></div>
      <div class="chartbox" id="chartbox">
        <svg id="curve" viewBox="0 0 720 230" role="img"></svg>
        <div class="tip" id="ctip" hidden></div>
      </div>
      <details><summary id="curve-values"></summary><div class="tablewrap" style="margin-top:6px;max-width:520px"><table class="smalltable" id="curve-table" style="margin:4px 12px 8px"></table></div></details>

/* ---------- sample schools: the same seeded generator as Classroom Signal, so the schools match ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(20261009);
function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function pickW(pairs){let s=0;for(const p of pairs)s+=p[1];let r=rnd()*s;for(const p of pairs){if((r-=p[1])<0)return p[0];}return pairs[pairs.length-1][0];}

const W=1000,H=700;
const REGION=[[120,140],[260,80],[420,110],[560,60],[720,95],[860,70],[930,190],[900,320],[950,450],[870,580],[700,630],[560,600],[420,650],[270,610],[150,520],[90,400],[110,270]];
const DISTRICTS=[
  {key:'dasaro',name:'Dasaro',seed:[500,360],n:30,sd:72,pNo:.03,pOff:.07,med:38,types:[['fibre',.45],['4g',.4],['3g',.05],['satellite',.1]],power:[['grid',.85],['solar',.12],['none',.03]]},
  {key:'kelemu',name:'Kelemu',seed:[250,215],n:22,sd:95,pNo:.08,pOff:.18,med:14,types:[['fibre',.1],['4g',.45],['3g',.3],['satellite',.15]],power:[['grid',.55],['solar',.35],['none',.1]]},
  {key:'tobani',name:'Tobani',seed:[700,175],n:20,sd:95,pNo:.1,pOff:.22,med:11,types:[['fibre',.05],['4g',.4],['3g',.35],['satellite',.2]],power:[['grid',.45],['solar',.4],['none',.15]]},
  {key:'wuraka',name:'Wuraka',seed:[255,500],n:20,sd:90,pNo:.12,pOff:.3,med:8,types:[['4g',.3],['3g',.4],['satellite',.3]],power:[['grid',.35],['solar',.45],['none',.2]]},
  {key:'matebo',name:'Matebo',seed:[565,560],n:18,sd:85,pNo:.07,pOff:.15,med:17,types:[['fibre',.1],['4g',.5],['3g',.2],['satellite',.2]],power:[['grid',.6],['solar',.3],['none',.1]]},
  {key:'ruvazi',name:'Ruvazi',seed:[835,415],n:18,sd:85,pNo:.15,pOff:.35,med:6,types:[['4g',.25],['3g',.35],['satellite',.4]],power:[['grid',.25],['solar',.5],['none',.25]]}
];
const DMAP={};DISTRICTS.forEach((d,i)=>{d.i=i;DMAP[d.key]=d;});

function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
function edgeDist(p,poly){let m=1e9;for(let i=0;i<poly.length;i++)m=Math.min(m,segDist(p,poly[i],poly[(i+1)%poly.length]));return m;}
function nearest(x,y){let bi=0,bd=1e9;DISTRICTS.forEach((d,i)=>{const dd=Math.hypot(d.seed[0]-x,d.seed[1]-y);if(dd<bd){bd=dd;bi=i;}});return bi;}

const ON=['k','m','t','b','d','s','n','l','w','r','g','y','f','z'];
const MID=['k','m','t','b','d','s','n','l','w','r','g','y','mb','nd','ng'];
const VW=['a','e','i','o','u'];
const used=new Set();
function village(){let n;do{const syl=rnd()<.55?2:3;n=ON[Math.floor(rnd()*ON.length)]+VW[Math.floor(rnd()*5)];for(let i=1;i<syl;i++)n+=MID[Math.floor(rnd()*MID.length)]+VW[Math.floor(rnd()*5)];n=n[0].toUpperCase()+n.slice(1);}while(used.has(n));used.add(n);return n;}

const TODAY=Date.UTC(2026,9,9);
const DAY=86400000;
function median(a){if(!a.length)return null;const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;}

const schools=[];
let idn=1040;
DISTRICTS.forEach(d=>{
  let made=0,tries=0;
  while(made<d.n&&tries<6000){
    tries++;
    const x=d.seed[0]+gauss()*d.sd, y=d.seed[1]+gauss()*d.sd*.85;
    if(!inPoly([x,y],REGION)||edgeDist([x,y],REGION)<24)continue;
    if(nearest(x,y)!==d.i)continue;
    if(schools.some(s=>Math.hypot(s.x-x,s.y-y)<21))continue;
    made++;
    const level=rnd()<.72?'primary':'secondary';
    const r=rnd();
    const kind=r<d.pNo?'nodata':(r<d.pNo+d.pOff?'offline':'online');
    let type=pickW(d.types);
    if(kind==='nodata'&&rnd()<.55)type='none';
    let power=pickW(d.power);
    if(kind==='offline'&&rnd()<.35)power='none';
    const tf={fibre:2.2,'4g':1,'3g':.35,satellite:.7,none:0}[type];
    const base=Math.min(160,d.med*tf*Math.exp(gauss()*.55));
    const daily=[];
    for(let k=0;k<14;k++){
      let v=null;
      if(kind==='online'){const pf=type==='3g'?.16:(type==='satellite'?.12:.06);if(rnd()>pf)v=Math.round(base*Math.exp(gauss()*.28)*10)/10;}
      else if(kind==='offline'){if(k<7&&rnd()<.45)v=Math.round(base*Math.exp(gauss()*.3)*10)/10;}
      daily.push(v);
    }
    if(kind==='online'&&daily.slice(7).every(v=>v===null))daily[13]=Math.round(base*10)/10;
    const last7=daily.slice(7).filter(v=>v!==null);
    let lastIdx=-1;for(let k=13;k>=0;k--){if(daily[k]!==null){lastIdx=k;break;}}
    const lat=type==='fibre'?18+rnd()*25:type==='4g'?45+rnd()*50:type==='3g'?110+rnd()*160:type==='satellite'?560+rnd()*180:null;
    schools.push({
      id:'CLR-'+(idn+=1+Math.floor(rnd()*6)),
      v:village(), level, d:d.key, x, y,
      device:kind!=='nodata', type, power, daily,
      speed:kind==='online'?Math.round(median(last7)*10)/10:null,
      lastIdx, latency:kind==='online'&&lat?Math.round(lat):null,
      students:level==='primary'?140+Math.round(rnd()*760):320+Math.round(rnd()*1080)
    });
  }
});

function placeLabels(){
  return DISTRICTS.map((d,i)=>{
    let best=d.seed,bs=-1e9;

  gLabels=DISTRICTS.map((d,i)=>{const tx=el('text',{x:LABELS[i][0],y:LABELS[i][1],'text-anchor':'middle','font-family':'Georgia, "Iowan Old Style", "Palatino Linotype", serif','font-style':'italic',fill:'var(--ink-2)',stroke:'var(--land)','paint-order':'stroke','stroke-linejoin':'round'},lg);tx.textContent=d.name;return tx;});
  gMarks=el('g',{},svg);gSel=el('g',{'pointer-events':'none'},svg);
}
/* a mast: a pole with a radio wave on each side */
function mastPath(x,y,k){return 'M'+x+' '+(y+7*k)+'V'+(y-5*k)+'M'+(x-4*k)+' '+(y-9*k)+'Q'+(x-6.5*k)+' '+(y-5*k)+' '+(x-4*k)+' '+(y-1*k)+'M'+(x+4*k)+' '+(y-9*k)+'Q'+(x+6.5*k)+' '+(y-5*k)+' '+(x+4*k)+' '+(y-1*k);}
function renderMap(){
  if(!gMarks)return;
  const k=W2/(svg.clientWidth||600),L=t();
  gMinor.style.display=(10/k<7)?'none':'';
  gLabels.forEach(tx=>{tx.setAttribute('font-size',(15*k).toFixed(2));tx.setAttribute('stroke-width',(4*k).toFixed(2));});
  gCover.innerHTML='';gBack.innerHTML='';gLinks.innerHTML='';gTowers.innerHTML='';gMarks.innerHTML='';gSel.innerHTML='';
  if(state.layers.mobile)TOWERS.forEach(tw=>el('circle',{cx:tw[0],cy:tw[1],r:tw[2],fill:'var(--accent)','fill-opacity':.07,stroke:'var(--accent)','stroke-opacity':.55,'stroke-width':1,'stroke-dasharray':'5 4','vector-effect':'non-scaling-stroke'},gCover));
  if(state.layers.fibre){BACKBONE.forEach(line=>el('path',{d:'M'+line.map(p=>p.join(' ')).join('L'),fill:'none',stroke:'var(--ink-2)','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},gBack));
    POPS.forEach(p=>el('rect',{x:p[0]-4.5*k,y:p[1]-4.5*k,width:9*k,height:9*k,fill:'var(--land)',stroke:'var(--ink-2)','stroke-width':2,'vector-effect':'non-scaling-stroke'},gBack));}
  if(state.layers.mobile)TOWERS.forEach(tw=>{const x=tw[0],y=tw[1];el('path',{d:mastPath(x,y,k),fill:'none',stroke:'var(--ink-2)','stroke-width':1.6,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'},gTowers);el('circle',{cx:x,cy:y-5*k,r:1.9*k,fill:'var(--ink-2)'},gTowers);});
  if(state.layers.links)P.plan.forEach(s=>{
    if(s.choice.k==='fibre'){const a={x1:s.fibreAt[0],y1:s.fibreAt[1],x2:s.x,y2:s.y,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'};
      el('line',Object.assign({stroke:'var(--land)','stroke-width':6},a),gLinks);el('line',Object.assign({stroke:'var(--accent)','stroke-width':3},a),gLinks);}
    else if(s.choice.k==='mobile'){const tw=TOWERS[s.tower.i];el('line',{x1:tw[0],y1:tw[1]-7*k,x2:s.x,y2:s.y,stroke:'var(--ink-2)','stroke-width':1.5,'stroke-dasharray':'2 4','stroke-linecap':'round','vector-effect':'non-scaling-stroke'},gLinks);}
  });
  const rankOrder={meets:0,nodata:1,out:2,none:3,plan:4};
  const sorted=schools.slice().sort((a,b)=>rankOrder[catOf(a)]-rankOrder[catOf(b)]);
  const counts={plan:0,out:0,none:0,meets:0,nodata:0};
  sorted.forEach(s=>{
    const c=catOf(s);counts[c]++;const g=el('g',{},gMarks),x=s.x,y=s.y,r=6.5*k;
    el('circle',{cx:x,cy:y,r:13*k,fill:'transparent'},g);
    if(c==='plan')el('path',{d:'M'+x+' '+(y-r*1.2)+'L'+(x+r*1.2)+' '+y+'L'+x+' '+(y+r*1.2)+'L'+(x-r*1.2)+' '+y+'Z',fill:'var(--accent)',stroke:'var(--mark-stroke)','stroke-width':1.3,'stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},g);
    else if(c==='out')el('circle',{cx:x,cy:y,r:r*.72,fill:'var(--none)',stroke:'var(--mark-stroke)','stroke-width':1.1,'vector-effect':'non-scaling-stroke'},g);
    else if(c==='none')el('path',{d:'M'+(x-r*.75)+' '+(y-r*.75)+'L'+(x+r*.75)+' '+(y+r*.75)+'M'+(x+r*.75)+' '+(y-r*.75)+'L'+(x-r*.75)+' '+(y+r*.75),stroke:'var(--crit)','stroke-width':2.6,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'},g);
    else if(c==='meets')el('circle',{cx:x,cy:y,r:2.4*k,fill:'var(--ink-3)','fill-opacity':.6},g);
    else el('circle',{cx:x,cy:y,r:r*.7,fill:'var(--land)',stroke:'var(--none)','stroke-width':2,'vector-effect':'non-scaling-stroke'},g);
    g.style.cursor='pointer';
    g.addEventListener('pointerenter',ev=>showTip(s,ev));g.addEventListener('pointermove',moveTip);g.addEventListener('pointerleave',hideTip);
    g.addEventListener('click',()=>{hideTip();selectSchool(s.id,{fromMap:true});});
  });
  const sel=schools.find(s=>s.id===state.selected);
  if(sel)el('circle',{cx:sel.x,cy:sel.y,r:12*k,fill:'none',stroke:'var(--accent)','stroke-width':3,'vector-effect':'non-scaling-stroke'},gSel);
  svg.setAttribute('aria-label',L.mapAlt(counts));
}
function renderLegend(){
  const L=t(),ul=$('legend');ul.innerHTML='';
  const items=[[markSVG('plan',14),L.leg.plan],[markSVG('out',14),L.leg.out],[markSVG('none',14),L.leg.none],[markSVG('meets',14),L.leg.meets],[markSVG('nodata',14),L.leg.nodata],
    [LINE_KEY('var(--ink-2)'),L.leg.backbone],['<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="2.5" width="9" height="9" fill="var(--land)" stroke="var(--ink-2)" stroke-width="2"/></svg>',L.leg.pop],
    ['<svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><circle cx="11" cy="9" r="8" fill="var(--accent)" fill-opacity=".1" stroke="var(--accent)" stroke-dasharray="3 2"/><path d="'+mastPath(11,9,0.85)+'" stroke="var(--ink-2)" stroke-width="1.4" fill="none" stroke-linecap="round"/><circle cx="11" cy="4.75" r="1.5" fill="var(--ink-2)"/></svg>',L.leg.tower],
    [LINE_KEY('var(--accent)'),L.leg.fibreLink],[LINE_KEY('var(--ink-2)','2 4'),L.leg.mobileLink]];
  items.forEach(([icon,text])=>{const li=document.createElement('li');li.innerHTML=icon+'<span></span>';li.querySelector('span').textContent=text;ul.append(li);});
  const lay=$('layers');lay.innerHTML='';
  ['fibre','mobile','links'].forEach(key=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',String(state.layers[key]));b.textContent=L.layer[key];b.addEventListener('click',()=>{state.layers[key]=!state.layers[key];b.setAttribute('aria-pressed',String(state.layers[key]));renderMap();});lay.append(b);});
}
const tip=$('tip'),mapbox=$('mapbox');
function tipText(s){const L=t(),c=catOf(s);if(c==='plan'||c==='out')return L.leg[c]+': '+L.tech[s.choice.k]+', '+money(s.cost);return L.leg[c];}
function showTip(s,ev){tip.innerHTML='';const b=document.createElement('b');b.textContent=nameOf(s);tip.append(b,document.createTextNode(tipText(s)));tip.hidden=false;moveTip(ev);}
function moveTip(ev){const r=mapbox.getBoundingClientRect();let x=ev.clientX-r.left+14,y=ev.clientY-r.top+14;if(x+tip.offsetWidth>r.width-6)x=ev.clientX-r.left-tip.offsetWidth-14;if(y+tip.offsetHeight>r.height-6)y=ev.clientY-r.top-tip.offsetHeight-14;tip.style.left=Math.max(6,x)+'px';tip.style.top=Math.max(6,y)+'px';}
function hideTip(){tip.hidden=true;}

/* ---------- list ---------- */
function listFor(k){if(k==='plan')return P.plan;if(k==='out')return P.ordered.filter(s=>!P.inPlan.has(s));return P.none.slice().sort((a,b)=>b.students-a.students);}
function renderFilters(){
  const L=t(),f=$('filters');f.innerHTML='';
  ['plan','out','none'].forEach(k=>{const b=document.createElement('button');b.type='button';b.className='chip';b.setAttribute('aria-pressed',String(state.show===k));b.innerHTML=markSVG(k,14)+'<span></span><b></b>';b.querySelector('span').textContent=L.show[k];b.querySelector('b').textContent=nf(listFor(k).length);
    b.addEventListener('click',()=>{state.show=k;$('fallback').hidden=true;renderFilters();renderList();$('live').textContent=L.count(listFor(k).length,k);});f.append(b);});
}
function renderList(){
  const L=t(),list=listFor(state.show),ul=$('schools');ul.innerHTML='';
  $('count').textContent=L.count(list.length,state.show);
  list.forEach(s=>{
    const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.className='row';b.dataset.id=s.id;
    if(s.id===state.selected)b.setAttribute('aria-current','true');
    const rank=P.rank.get(s),c=catOf(s);
    b.innerHTML=(rank?'<span class="rk '+(c==='plan'?'in':'out')+'" aria-hidden="true"></span>':'<span class="rk">'+markSVG('none',16)+'</span>')+'<span class="nm"></span><span class="sr-only sep1"></span><span class="sp"></span><span class="sr-only">. </span><span class="meta"></span>';
    if(rank)b.querySelector('.rk').textContent=rank;
    b.querySelector('.nm').textContent=nameOf(s);
    b.querySelector('.sep1').textContent=rank?' (#'+rank+'). ':'. '+L.leg.none+'. ';
    const sp=b.querySelector('.sp');
    if(s.choice){sp.textContent=money(s.cost);const sm=document.createElement('small');sm.textContent=' '+L.tech[s.choice.k];sp.append(sm);}else{sp.textContent=L.status[statusOf(s)];}
    b.querySelector('.meta').textContent=DMAP[s.d].name+', '+L.students(nf(s.students));
    b.addEventListener('click',()=>selectSchool(s.id));
    li.append(b);ul.append(li);
  });
  const e=$('empty');e.hidden=list.length>0;e.textContent=L.emptyList[state.show];
}

/* ---------- detail ---------- */
let lastFocusId=null;
function selectSchool(id,opts){
  state.selected=id;lastFocusId=id;
  if(opts&&opts.fromMap&&window.matchMedia('(max-width:760px)').matches)setView('list');
  $('listview').hidden=true;$('detailview').hidden=false;renderDetail();renderMap();
  const h=$('dname');if(h)h.focus();
}
function closeDetail(){
  state.selected=null;$('detailview').hidden=true;$('listview').hidden=false;renderList();renderMap();
  const b=document.querySelector('.row[data-id="'+lastFocusId+'"]');if(b){b.focus();b.scrollIntoView({block:'nearest'});}else $('schools').focus();
}
function renderDetail(){
  const L=t(),s=schools.find(x=>x.id===state.selected),box=$('detail');box.innerHTML='';if(!s)return;
  const st=statusOf(s),c=catOf(s);
  const back=document.createElement('button');back.type='button';back.className='backbtn';
  back.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span>';back.querySelector('span').textContent=L.back;back.addEventListener('click',closeDetail);
  const head=document.createElement('div');head.style.cssText='display:grid;gap:4px';
  const h=document.createElement('h3');h.className='dname';h.id='dname';h.tabIndex=-1;h.textContent=nameOf(s);
  const sub=document.createElement('p');sub.className='dsub';sub.innerHTML='<span class="place"></span>, '+s.id;sub.querySelector('.place').textContent=DMAP[s.d].name;head.append(h,sub);
  const sl=document.createElement('p');sl.className='statusline';sl.innerHTML=statusSVG(st)+'<span></span>';
  sl.querySelector('span').textContent=st==='below'||st==='meets'?L.now[st](mbps(Math.round(s.speed))):L.now[st];
  const v=document.createElement('p');v.className='verdict';
  if(c==='plan')v.textContent=L.inPlan(P.rank.get(s),P.plan.length);
  else if(c==='out'){const more=s.cost-P.left;v.textContent=more>0?L.outPlan(P.rank.get(s),money(more)):L.outSkip(P.rank.get(s));}
  else if(c==='none')v.textContent=L.noOption(state.target);
  else v.textContent=c==='nodata'?L.nodataDetail:L.meetsDetail;
  box.append(back,head,sl,v);
  if(s.opts){
    const h4=document.createElement('h4');h4.className='ph';h4.style.cssText='margin:0;font-size:var(--text-base)';h4.textContent=L.optTitle;
    const tb=document.createElement('table');tb.className='opts';
    tb.innerHTML='<thead><tr><th scope="col"></th><th scope="col" class="num"></th><th scope="col" class="num"></th></tr></thead><tbody></tbody>';
    const ths=tb.querySelectorAll('th');ths[0].textContent=L.colOption;ths[1].textContent=L.colSpeed;ths[2].textContent=L.colCost;
    s.opts.forEach(o=>{
      const tr=document.createElement('tr'),th=document.createElement('th');th.scope='row';th.textContent=L.tech[o.k];
      if(s.choice===o){tr.className='chosen';const tag=document.createElement('span');tag.className='tag';tag.style.marginLeft='6px';tag.textContent=L.chosen;th.append(' ',tag);}
      const a=document.createElement('td'),b=document.createElement('td');a.className='num';b.className='num';
      if(o.na){const td=document.createElement('td');td.colSpan=2;td.className='na';td.textContent=o.na==='far'?L.na.far(km(s.fibreKm))+km(A.maxKm)+NB+'km':L.na.nocov;tr.append(th,td);}
      else{a.textContent=mbps(o.speed)+(o.ok?'':' · '+L.slow);if(!o.ok)a.classList.add('na');b.textContent=money(o.total);tr.append(th,a,b);}
      tb.querySelector('tbody').append(tr);
    });
    box.append(h4,tb);
  }
  const dl=document.createElement('dl');dl.className='facts';
  const add=(k,val)=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=val;dl.append(dt,dd);};
  add(L.facts.students,nf(s.students));
  add(L.facts.fibre,km(s.fibreKm)+NB+'km');
  add(L.facts.mobile,s.tower?L.mobileSpeed(mbps(s.mobile)):L.noSignal);
  add(L.facts.power,L.power[s.power]);
  if(s.choice)add(L.facts.perStudent,money(Math.round(s.cost/s.students)));
  add(L.facts.id,s.id);
  box.append(dl);
}

/* ---------- work packages ---------- */
const TECH_ORDER=['fibre','repair','mobile','satellite'];
function lots(){
  const m=new Map();
  P.plan.forEach(s=>{const key=s.d+'|'+s.choice.k;if(!m.has(key))m.set(key,{d:s.d,k:s.choice.k,n:0,km:0,st:0,cost:0});const g=m.get(key);g.n++;g.st+=s.students;g.cost+=s.cost;if(s.choice.k==='fibre')g.km+=s.fibreKm;});
  return [...m.values()].sort((a,b)=>DMAP[a.d].name.localeCompare(DMAP[b.d].name)||TECH_ORDER.indexOf(a.k)-TECH_ORDER.indexOf(b.k));
}
function renderLots(){
  const L=t(),tb=$('lots'),rows=lots();tb.innerHTML='';
  const cols=L.lotCols,thead=document.createElement('thead'),tr=document.createElement('tr');
  const cls=i=>i>=2?'num'+(i===3||i===4?' opt':''):'';
  cols.forEach((c,i)=>{const th=document.createElement('th');th.scope='col';th.textContent=c;th.className=cls(i);tr.append(th);});thead.append(tr);
  const tbody=document.createElement('tbody');
  if(!rows.length){const r=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent=L.noLots;r.append(td);tbody.append(r);}
  rows.forEach(g=>{const r=document.createElement('tr');const cells=[DMAP[g.d].name,L.tech[g.k],nf(g.n),g.k==='fibre'?km(g.km)+NB+'km':'–',nf(g.st),money(g.cost)];
    cells.forEach((v,i)=>{const c=document.createElement(i?'td':'th');if(!i){c.scope='row';c.className='place';}else c.className=cls(i);c.textContent=v;r.append(c);});tbody.append(r);});
  const tfoot=document.createElement('tfoot');
  if(rows.length){const r=document.createElement('tr');const tot=[L.total,'',nf(P.plan.length),km(rows.reduce((a,g)=>a+g.km,0))+NB+'km',nf(sum(P.plan)),money(P.plan.reduce((a,s)=>a+s.cost,0))];
    tot.forEach((v,i)=>{const c=document.createElement(i?'td':'th');if(!i)c.scope='row';else c.className=cls(i);c.textContent=v;r.append(c);});tfoot.append(r);}
  tb.append(thead,tbody,tfoot);
}

/* ---------- assumptions ---------- */
function buildAssumptions(){
  const L=t(),f=$('assume');f.innerHTML='';
  A_KEYS.forEach(k=>{
    const id='a-'+k,wrap=document.createElement('div');wrap.className='field';
    const lab=document.createElement('label');lab.htmlFor=id;lab.textContent=L.a[k][0];
    const help=document.createElement('span');help.className='help';help.id=id+'-help';help.textContent=L.a[k][1];
    const inp=document.createElement('input');inp.type='number';inp.id=id;inp.min='0';inp.step=k==='years'||k==='maxKm'||k==='satSpeed'?'1':'100';inp.inputMode='numeric';inp.value=String(A[k]);inp.setAttribute('aria-describedby',id+'-help '+id+'-err');
    const err=document.createElement('p');err.className='error';err.id=id+'-err';err.hidden=true;
    inp.addEventListener('change',()=>{const v=Number(inp.value);if(inp.value===''||!isFinite(v)||v<0){inp.setAttribute('aria-invalid','true');err.textContent=L.invalid;err.hidden=false;return;}
      inp.removeAttribute('aria-invalid');err.hidden=true;err.textContent='';A[k]=v;save();update({announce:true});});
    wrap.append(lab,help,inp,err);f.append(wrap);
  });
}

/* ---------- copy ---------- */
function copyText(text,ok,fail){let p;try{p=navigator.clipboard&&navigator.clipboard.writeText(text);}catch(e){p=null;}if(!p){fail();return;}p.then(ok,fail);}
function csvCell(v){v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\n');
function showFallback(text){const f=$('fallback'),ta=$('fallback-text');ta.value=text;f.hidden=false;if(state.selected)closeDetail();ta.focus();ta.select();}

/* ---------- wiring ---------- */
function setView(v){state.view=v;$('mainview').dataset.view=v;$('view-list').setAttribute('aria-pressed',String(v==='list'));$('view-map').setAttribute('aria-pressed',String(v==='map'));if(v==='map')requestAnimationFrame(renderMap);}
let liveTimer=0;
function update(opts){
  compute();renderSummary();renderCurve();renderFilters();renderList();renderLots();
  if(state.selected){renderDetail();}
  renderMap();
  if(opts&&opts.announce){clearTimeout(liveTimer);liveTimer=setTimeout(()=>{$('live').textContent=$('hero').textContent+'.';},500);}
}
$('budget').addEventListener('input',e=>{state.budget=Number(e.target.value);save();update({announce:true});});
$('rule-value').addEventListener('click',()=>{state.rule='value';save();update({announce:true});});
$('rule-equity').addEventListener('click',()=>{state.rule='equity';save();update({announce:true});});
$('target').addEventListener('change',e=>{state.target=Number(e.target.value);save();update({announce:true});});
$('lang-en').addEventListener('click',()=>{state.lang='en';save();applyStatic();update();});
$('lang-fr').addEventListener('click',()=>{state.lang='fr';save();applyStatic();update();});
$('view-list').addEventListener('click',()=>setView('list'));
$('view-map').addEventListener('click',()=>setView('map'));
$('assume-reset').addEventListener('click',()=>{A=Object.assign({},A0);save();buildAssumptions();update({announce:true});});
$('copy-list').addEventListener('click',()=>{
  const L=t(),list=listFor(state.show);
  const text=toCSV([L.csvList].concat(list.map(s=>[P.rank.get(s)||'',s.id,nameOf(s),DMAP[s.d].name,L.status[statusOf(s)],s.choice?L.tech[s.choice.k]:'',s.cost===null?'':s.cost,s.students])));
  $('fallback').hidden=true;copyText(text,()=>{$('copy-msg').textContent=L.copied(list.length);},()=>{$('copy-msg').textContent=L.copyBlocked;showFallback(text);});
});
$('copy-lots').addEventListener('click',()=>{
  const L=t(),rows=lots();
  const text=toCSV([L.csvLots].concat(rows.map(g=>[DMAP[g.d].name,L.tech[g.k],g.n,g.k==='fibre'?Math.round(g.km*10)/10:'',g.st,g.cost])));
  copyText(text,()=>{$('lots-msg').textContent=L.copied(rows.length);},()=>{$('lots-msg').textContent=L.copyBlocked;showFallback(text);});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.selected)closeDetail();});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();if(state.view==='map')setView('list');const target=state.selected?$('dname'):$('schools');if(target)target.focus();});
let chartW=0;
if('ResizeObserver' in window){new ResizeObserver(()=>renderMap()).observe(svg);new ResizeObserver(()=>{const w=$('chartbox').clientWidth;if(P&&w!==chartW){chartW=w;renderCurve();}}).observe($('chartbox'));}
else window.addEventListener('resize',()=>{renderMap();renderCurve();});

buildMap();applyStatic();setView('list');update();
})();
</script>
